# Прод-раскладка на сервере Dokploy (вне приложений Dokploy, отдельный compose-проект):
#   /opt/psy-whisper/docker-compose.yml  <- этот файл
#   /opt/psy-whisper/src/                <- ВСЕ файлы из Dockerfile COPY:
#        Dockerfile, requirements.txt, app.py, chunking.py, safe_http.py, sources.py
#   /opt/psy-whisper/data/               <- медиа (inbox/, audio/); общий volume контейнера
#   /opt/psy-whisper/.env                <- WHISPER_TOKEN=... обязателен и непустой
#                                          (chmod 600, в git не класть; значение не логировать)
#   /opt/psy-whisper/prompts/courses.json <- списки курсов (chmod 600, в git не класть)
#     пустой шаблон: services/whisper/prompts.example.json
#     каталог создать ДО первого up, иначе Docker создаст его сам от root
#
# Деплой (после отдельного «ок» владельца):
#   1) docker tag psy-whisper:local psy-whisper:pre-step2 && cp -a src src.pre-step2
#   2) дождаться /health busy=false
#   3) скопировать все файлы COPY из Dockerfile в src/, docker compose build && up -d
#   4) смоук: GET /health; POST /source/probe (с токеном) на синтетике; старый /extract-audio
#
# Контейнер живёт постоянно: после WHISPER_IDLE_UNLOAD_SEC простоя модель
# выгружается из RAM, процесс остаётся. У n8n нет docker.sock и SSH к хосту,
# поэтому "запуск по требованию" ему недоступен.
# Порт наружу не публикуется. n8n обращается по имени: http://psy-whisper:8080
name: psy-whisper

services:
  whisper:
    build: ./src
    image: psy-whisper:local
    container_name: psy-whisper
    hostname: psy-whisper
    restart: unless-stopped
    env_file: .env
    environment:
      WHISPER_MODEL: large-v3-turbo
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: "8"
      OMP_NUM_THREADS: "8"
      WHISPER_IDLE_EXIT_SEC: "0"
      WHISPER_IDLE_UNLOAD_SEC: "900"
      WHISPER_MIN_FREE_MB: "3072"
      DATA_DIR: /data
      WHISPER_CACHE_DIR: /models
      HF_HUB_CACHE: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
      MKL_ENABLE_INSTRUCTIONS: AVX512
      WHISPER_CHUNK_SEC: "600"
      WHISPER_CHUNK_OVERLAP_SEC: "20"
      WHISPER_CONDITION_ON_PREVIOUS_TEXT: "0"
      WHISPER_PROMPTS_FILE: /prompts/courses.json
    volumes:
      - whisper-models:/models
      - /opt/psy-whisper/data:/data
      - /opt/psy-whisper/prompts:/prompts:ro
    networks:
      n8n:
        aliases: [psy-whisper]
    cpus: 7
    mem_limit: 4g
    memswap_limit: 4g
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  whisper-models:
    name: psy-whisper-models

networks:
  n8n:
    name: myn8n-n8n-iucjks
    external: true
